name: Update profile visuals

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-visuals.yml
      - config/contribution-map.json

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate 3D contribution maps
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: config/contribution-map.json
          TZ: America/New_York

      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/activity/snake-light.svg?color_snake=#173d66&color_dots=#edf2f7,#c4ddf5,#86b6e7,#4688c7,#245ca6
            assets/activity/snake-dark.svg?palette=github-dark&color_snake=#93c5fd&color_dots=#161b22,#173d66,#245ca6,#4688c7,#93c5fd

      - name: Publish generated graphics
        run: |
          mkdir -p assets/activity
          cp profile-3d-contrib/contributions-light.svg assets/activity/
          cp profile-3d-contrib/contributions-dark.svg assets/activity/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update contribution graphics"
          git pull --rebase origin main
          git push origin HEAD:main
