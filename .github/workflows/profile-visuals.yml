name: Update profile visuals

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-visuals.yml

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate classic Metrics card
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: brucefjn
          filename: github-metrics.svg
          output_action: none
          template: classic
          config_timezone: America/New_York
          base: header, activity, community, repositories, metadata
          repositories_affiliations: owner
          repositories_forks: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugins_errors_fatal: yes

      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/activity/snake-light.svg?color_snake=#173d66&color_dots=#edf2f7,#c4ddf5,#86b6e7,#4688c7,#245ca6
            assets/activity/snake-dark.svg?palette=github-dark&color_snake=#93c5fd&color_dots=#161b22,#173d66,#245ca6,#4688c7,#93c5fd

      - name: Publish generated graphics
        run: |
          mkdir -p assets/activity
          cp /metrics_renders/github-metrics.svg github-metrics.svg
          test -s github-metrics.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg assets/activity
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update contribution graphics"
          git pull --rebase origin main
          git push origin HEAD:main
